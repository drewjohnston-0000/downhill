name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install "gdtoolkit==4.*"
      - name: gdlint
        run: gdlint sim presentation main test

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MikeSchulze/gdUnit4-action@v1
        with:
          godot-version: "4.8"
          godot-status: "dev5"
          paths: res://test
          timeout: 5
